name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo. Jobs do not write back.
permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + check + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vital-fold-engine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: vital-fold-engine
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo test
        run: cargo test --all-targets

  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vital-fold-engine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@8b3c737da4b541bf0fb5a3e0488ff20535badac9 # v2.82.1
        with:
          tool: cargo-audit
      # Ignored advisories (all unfixable or in unreachable transitive paths) are
      # documented in vital-fold-engine/.cargo/audit.toml, which cargo-audit reads
      # automatically. Everything cleanly fixable is kept patched in Cargo.lock.
      - name: cargo audit
        run: cargo audit
