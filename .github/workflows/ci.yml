name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo. Jobs do not write back.
permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + check + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vital-fold-engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: vital-fold-engine
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo test
        run: cargo test --all-targets

  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vital-fold-engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: taiki-e/install-action@50b4a718b59c718df4ef27a3b445f86cd57b9f00 # v2.80.0
        with:
          tool: cargo-audit
      # Ignored advisories (all unfixable or in unreachable transitive paths) are
      # documented in vital-fold-engine/.cargo/audit.toml, which cargo-audit reads
      # automatically. Everything cleanly fixable is kept patched in Cargo.lock.
      - name: cargo audit
        run: cargo audit
